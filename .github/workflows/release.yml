# Manually publish a Genpact-Job-Ai release from a CI-passing master commit.
# Commitizen computes the SemVer bump from merged commit types unless a version
# is supplied. The last reachable tag supplies the base for release notes.

name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the computed version (e.g. 2.0.0, no v). Leave blank to derive it from the merged commits."
        required: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Tag and publish the release
    if: github.repository == 'darksarkar28-boop/Genpact-Job-Ai'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 HEAD)
          head=$(git rev-parse HEAD)
          if [ "$(git rev-parse "$last^{commit}")" = "$head" ]; then
            echo "No commits since $last, nothing to release"
            exit 0
          fi
          if [ -n "$VERSION" ]; then
            next="v$VERSION"
          else
            rc=0
            next=$(uvx --from commitizen==4.19.3 cz bump --get-next) || rc=$?
            case $rc in
              0) next="v$next" ;;
              21) echo "No version-bumping commits since $last, nothing to release"; exit 0 ;;
              *) echo "::error::cz bump --get-next exited $rc: $next"; exit 1 ;;
            esac
          fi
          ci=$(gh run list -w ci.yml -b master -c "$head" -L 1 --json conclusion -q '.[0].conclusion')
          if [ "$ci" != success ]; then
            echo "::error::CI on $head is '${ci:-missing or not finished}', not releasing"
            exit 1
          fi
          if ! [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$next' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists"
            exit 1
          fi
          if [ "$(printf '%s\n' "${last#v}" "${next#v}" | sort -V | tail -n1)" != "${next#v}" ]; then
            echo "::error::$next is not newer than $last"
            exit 1
          fi
          gh release create "$next" --target "$head" --generate-notes --notes-start-tag "$last"
