# CI covers LaTeX smoke compiles, skill and command lint, Python tests, and
# optional portal CLI typechecks. Stock example and placeholder checks run
# automatically. A personalized fork can set CI_STOCK_TEMPLATE=false or
# choose the stock checks explicitly when dispatching the workflow.
#
# No portal CLI ships here; they live in ai-job-search-dev/community-portals.
# A fork that copies one into .agents/skills/ gets its typecheck and fixture
# tests run by cli-checks; cli-checks-result rolls the matrix up into one
# check name a ruleset can require. Deliberately NOT here: live smoke tests
# of portal CLIs - they hit real portals (network-flaky, and some portals'
# terms forbid automated requests). Live portal testing stays a local,
# on-demand step.
#
# Security posture: this template ships pre-approved Claude Code permissions
# and CLI code that every fork user executes, so the security-guards job
# fails PRs that widen settings.json permissions, weaken the personal-data
# gitignore rules, or add package lifecycle scripts; dependency-review flags
# newly introduced vulnerable/malicious dependencies. Honest limit: a PR can
# edit this workflow itself, so these guards catch accidents and casual
# attempts, not a determined author - branch protection with required checks
# and human review of workflow/settings diffs remain the real backstop.
# Actions are pinned to commit SHAs; the token is read-only, and no checkout
# leaves it in .git/config (persist-credentials: false) for later steps to read.

name: CI

on:
  push:
    branches: [master, ci/cli-checks-result]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      stock_template:
        description: Run checks specific to the unpersonalized template
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web-onboarding:
    name: Web profile onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: python -m pip install -r webapp/requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test webapp
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python manage.py test webapp.browser_smoke

  lint:
    name: Lint skills, commands, settings
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/lint_skills.py
      - name: Check workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Require every CI job to contribute to the gate
        shell: python
        run: |
          from pathlib import Path
          import yaml

          jobs = yaml.safe_load(Path(".github/workflows/ci.yml").read_text())["jobs"]
          pending = ["ci-result"]
          covered = set()
          while pending:
              job = pending.pop()
              if job in covered:
                  continue
              covered.add(job)
              needs = jobs[job].get("needs", [])
              pending.extend([needs] if isinstance(needs, str) else needs)
          missing = jobs.keys() - covered
          if missing:
              raise SystemExit("Add these jobs to the CI gate: " + ", ".join(sorted(missing)))
      - name: Check framework version changes
        run: python tools/check_framework_version.py

  security-guards:
    name: Security guards (permissions, gitignore, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py

  python-tests:
    name: Python tool tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Excel integration test dependency
        run: python -m pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -t . -v

  python-tests-windows:
    # Linux-green says nothing about Windows file locking, console encodings or
    # path handling, and many users run Windows: #480 and #486 passed every Linux
    # leg and failed there. The suite runs under Git Bash, the shell Claude Code
    # uses for its Bash tool on Windows, with stdout left at the Windows default
    # encoding, so a cp1252 crash shows up here the way it does for a user.
    name: Python tool tests (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install Excel integration test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Run the suite under Git Bash
        shell: bash
        run: python -m unittest discover -s tests -t . -v

  dependency-review:
    name: Dependency review
    # Requires the repo's Dependency graph, which not every repo (upstream or
    # fork) has enabled - so the graph is probed first, and the job warns and
    # passes instead of hard-failing if it's unavailable (the same
    # graceful-skip pattern the workflow uses for optional tools), rather than
    # being gated to a specific repository. Enabling Dependency graph under
    # Settings -> Advanced Security activates the real check on any repo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped - enable Dependency graph under Settings -> Advanced Security to activate this check."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  latex-smoke:
    # Two legs. texlive/texlive:latest tracks current TeX Live (moderncv 2.5+);
    # debian:bookworm compiles on apt-packaged TeX Live 2022 with moderncv
    # 2.3.1 - the environment #242 hit and the one texlive:latest can never
    # catch a regression in, because it never shipped the old class. The
    # README's Linux setup path is apt, so both ends of the moderncv range
    # users actually have stay compiled.
    name: Compile example CV and cover letter (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.leg.container }}
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: texlive-latest
            container: texlive/texlive:latest
          - name: debian-bookworm
            container: debian:bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install apt-packaged TeX Live (bookworm leg)
        if: matrix.leg.name == 'debian-bookworm'
        # --no-install-recommends keeps the leg lean, so the two font packages
        # must then be named explicitly: moderncv loads fontawesome5, which apt
        # ships in texlive-fonts-extra (lualatex dies fatally without it), and
        # hyperref's xetex driver probes the pzdr metrics from
        # texlive-fonts-recommended (the cover letter fails without it).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-xetex \
            texlive-fonts-extra texlive-fonts-recommended \
            poppler-utils python3
      - name: Install PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Compile CV example (lualatex)
        run: |
          cd cv
          lualatex -interaction=nonstopmode -halt-on-error main_example.tex
          test -f main_example.pdf
          if grep -q '^!' main_example.log; then
            echo '::error::lualatex reported errors compiling cv/main_example.tex'
            grep -A3 '^!' main_example.log
            exit 1
          fi
      - name: Compile cover letter example (xelatex)
        run: |
          cd cover_letters
          xelatex -interaction=nonstopmode -halt-on-error cover_example.tex
          test -f cover_example.pdf
          if grep -q '^!' cover_example.log; then
            echo '::error::xelatex reported errors compiling cover_letters/cover_example.tex'
            grep -A3 '^!' cover_example.log
            exit 1
          fi
      - name: Verify extractable PDF text
        run: |
          python3 tools/verify_pdf.py cv/main_example.pdf --min-chars 100
          python3 tools/verify_pdf.py cover_letters/cover_example.pdf --min-chars 100
      - name: Assert stock PDF structure
        if: (github.event_name == 'workflow_dispatch' && inputs.stock_template) || (github.event_name != 'workflow_dispatch' && vars.CI_STOCK_TEMPLATE != 'false')
        run: |
          python3 tools/verify_pdf.py cv/main_example.pdf \
            --pages 2 \
            --ascii-dates \
            --contains '[your.email@example.com]' \
            --contains 'Professional Experience' \
            --contains 'Achievement'
          python3 tools/verify_pdf.py cover_letters/cover_example.pdf \
            --pages 1 \
            --contains 'your.email@example.com' \
            --contains 'Dear [Hiring Manager / Team]'

  discover-clis:
    # The matrix is discovered, not hardcoded, so a portal CLI a fork copies in
    # or adds with /add-portal gets typechecked and tested without the fork
    # having to edit this workflow - the same reason security-guards globs
    # .agents/**/package.json instead of naming portals. Upstream ships none,
    # so the matrix is empty there and cli-checks is skipped.
    name: Discover portal CLIs
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - id: list
        run: |
          tools='[]'
          if [ -d .agents/skills ]; then
            tools=$(find .agents/skills -mindepth 3 -maxdepth 3 -path '*/cli/package.json' \
              | cut -d/ -f3 | sort | jq -R . | jq -cs .)
          fi
          echo "Discovered portal CLIs: $tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  cli-checks:
    name: CLI checks ${{ matrix.tool }}
    needs: discover-clis
    if: needs.discover-clis.outputs.tools != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover-clis.outputs.tools) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --ignore-scripts
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - name: Run fixture/mock tests when present
        # The tool name is a directory name a pull request controls, so it
        # reaches the shell as data through env, never as expanded script text.
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          if find tests -type f -name '*.test.ts' | grep -q .; then
            bun test
          else
            echo "No Bun tests found for $TOOL; skipping"
          fi
        working-directory: .agents/skills/${{ matrix.tool }}/cli

  cli-checks-result:
    # always() plus the explicit result check: a required job skipped because
    # a need failed counts as passing.
    name: CLI checks result
    needs: [discover-clis, cli-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DISCOVER: ${{ needs.discover-clis.result }}
          CHECKS: ${{ needs.cli-checks.result }}
          TOOLS: ${{ needs.discover-clis.outputs.tools }}
        run: |
          test "$DISCOVER" = success
          if [[ "$TOOLS" == '[]' ]]; then
            test "$CHECKS" = skipped
          else
            test "$CHECKS" = success
          fi

  placeholder-integrity:
    name: Placeholder integrity (stock template)
    if: (github.event_name == 'workflow_dispatch' && inputs.stock_template) || (github.event_name != 'workflow_dispatch' && vars.CI_STOCK_TEMPLATE != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Tracked template files must keep their placeholder tokens
        run: |
          fail=0
          check() {
            if ! grep -q "$2" "$1"; then
              echo "::error file=$1::expected placeholder token $2 - personal data may have been committed"
              fail=1
            fi
          }
          check CLAUDE.md '\[YOUR_NAME\]'
          check cv/main_example.tex '\\name{\[First\]}{\[Last\]}'
          check cv/main_example.tex '\\email{\[your\.email@example\.com\]}'
          check cover_letters/cover_example.tex '\[YOUR NAME\]'
          check .claude/skills/job-application-assistant/01-candidate-profile.md '\[YOUR_EMAIL\]'
          check .claude/skills/job-application-assistant/04-job-evaluation.md '\[YOUR_PRIMARY_SKILLS\]'
          exit $fail

  ci-result:
    name: CI gate
    if: always()
    needs: [web-onboarding, lint, security-guards, python-tests, python-tests-windows, dependency-review, latex-smoke, cli-checks-result, placeholder-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report test results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EXPECT_DEPENDENCY_REVIEW: ${{ github.event_name == 'pull_request' }}
          EXPECT_STOCK: ${{ (github.event_name == 'workflow_dispatch' && inputs.stock_template) || (github.event_name != 'workflow_dispatch' && vars.CI_STOCK_TEMPLATE != 'false') }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          results = json.loads(os.environ["JOB_RESULTS"])
          expected_skips = set()
          if os.environ["EXPECT_DEPENDENCY_REVIEW"] != "true":
              expected_skips.add("dependency-review")
          if os.environ["EXPECT_STOCK"] != "true":
              expected_skips.add("placeholder-integrity")
          lines = ["## CI results", "", "| Check | Result |", "| --- | --- |"]
          failed = []
          for name, job in results.items():
              status = job["result"]
              lines.append(f"| {name} | {status} |")
              expected = "skipped" if name in expected_skips else "success"
              if status != expected:
                  failed.append(f"{name} ({status})")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          if failed:
              raise SystemExit("Checks requiring attention: " + ", ".join(failed))
